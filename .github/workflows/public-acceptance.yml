name: Bounded public deployment acceptance
on:
  push:
    branches: ['validation/public-*']
    paths: ['configs/public-acceptance-request.json']
permissions:
  contents: read
concurrency:
  group: mesa-public-acceptance
  cancel-in-progress: false
jobs:
  public:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -c requirements-api.lock -e '.[api]'
      - name: Verify requested public commit before consuming any model quota
        run: python scripts/check_public_revision.py
      - name: Prepare pinned independent catalog oracle
        run: python scripts/fetch_deploy_artifact.py
      - name: Execute bounded live acceptance
        run: python scripts/check_public_assistant.py --protocol configs/public-assistant-acceptance-v2.json --output reports/public-assistant-acceptance-v2.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-acceptance-evidence
          path: reports/public-assistant-acceptance-v2.json
          if-no-files-found: warn

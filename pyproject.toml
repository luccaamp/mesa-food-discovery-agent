[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "meal-discovery-ai"
version = "0.8.0"
description = "Meal recommendation and conversational discovery with reproducible evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
api = ["fastapi==0.162.0", "uvicorn==0.54.0", "langgraph==1.2.20", "prometheus-client==0.26.0",
       "opentelemetry-api==1.45.2", "opentelemetry-sdk==1.45.2", "opentelemetry-exporter-otlp-proto-http==1.45.2"]
mcp = ["mcp==2.3.0"]
channels = ["redis==6.4.0"]
test = ["httpx2==2.16.0", "fakeredis==2.40.0"]
semantic = ["numpy==2.3.5", "onnxruntime==1.31.1", "tokenizers==0.23.3"]
analysis = ["pandas==3.1.1", "matplotlib==3.11.2", "lightgbm==4.7.0"]

[project.scripts]
meal-discovery = "meal_discovery.__main__:main"
mesa-mcp = "meal_discovery.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
meal_discovery = ["prompts/*.txt", "data/*.json"]

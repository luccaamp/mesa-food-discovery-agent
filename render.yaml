services:
  - type: web
    name: mesa-meal-discovery
    runtime: docker
    plan: free
    region: virginia
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.1-flash-lite
      - key: MEAL_PUBLIC_MODE
        value: "1"
      - key: GEMINI_CALLS_PER_MINUTE
        value: "4"
      - key: GEMINI_CALLS_PER_DAY
        value: "20"
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_FALLBACK_PROVIDERS
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_CALLS_PER_MINUTE
        value: "10"
      - key: GROQ_CALLS_PER_DAY
        value: "300"
      - key: GROQ_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: mesa-queue
          property: connectionString
      - key: WHATSAPP_WORKER
        value: "1"
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: MESA_PRIVACY_SALT
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false

  # Receives WhatsApp webhooks, verifies and de-duplicates them, and queues them.
  - type: web
    name: mesa-whatsapp-gateway
    runtime: docker
    plan: free
    region: virginia
    branch: main
    dockerfilePath: ./services/whatsapp-gateway/Dockerfile
    dockerContext: ./services/whatsapp-gateway
    healthCheckPath: /health
    envVars:
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: mesa-queue
          property: connectionString
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      # Free services sleep when idle; the gateway wakes the agent worker after queueing.
      - key: AGENT_WAKE_URL
        value: https://mesa-meal-discovery.onrender.com/ready

  # Queue between the gateway and the agent worker. Internal network only.
  - type: keyvalue
    name: mesa-queue
    plan: free
    region: virginia
    ipAllowList: []
    maxmemoryPolicy: noeviction
